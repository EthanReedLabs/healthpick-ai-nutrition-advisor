[project]
name = "healthpick-knowledge-tools"
version = "0.1.0"
description = "Deterministic knowledge ingestion and validation tools for HealthPick."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.25,<5",
  "pymupdf>=1.28,<1.29",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api"]
addopts = "-q"
