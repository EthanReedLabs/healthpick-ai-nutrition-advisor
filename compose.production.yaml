services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 384M

  api:
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    deploy:
      resources:
        limits:
          memory: 384M

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - healthpick_caddy_data:/data
      - healthpick_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  healthpick_caddy_data:
  healthpick_caddy_config:
